<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Brand Violet to KMU Cobalt Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C6DF2" />
      <stop offset="45%" stop-color="#6C5CE7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Accent Energy Gradient -->
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Wing / Ribbon Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle / Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" />

  <!-- Dynamic Athletic Symbol in Center (Running Figure / Destiny Arc) -->
  <g filter="url(#shadow)">
    <!-- Motion Track Arc -->
    <path d="M 120 370 C 160 410, 320 420, 390 350 C 420 320, 420 270, 380 250 C 330 230, 240 280, 180 320" 
          fill="none" stroke="url(#energyGrad)" stroke-width="24" stroke-linecap="round" opacity="0.9" />

    <!-- Dynamic Runner Head -->
    <circle cx="340" cy="145" r="34" fill="#FFFFFF" />

    <!-- Runner Torso & Powerful Forward Leap -->
    <path d="M 330 185 L 285 270 L 220 300" 
          fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Forward Arm with Energy Spark -->
    <path d="M 305 220 L 370 240 L 410 205" 
          fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Rear Arm for Balance -->
    <path d="M 290 235 L 225 240 L 195 205" 
          fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Forward Lead Leg (High Knee) -->
    <path d="M 285 270 L 320 345 L 375 340" 
          fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Trailing Leg (Push-off Drive) -->
    <path d="M 220 300 L 170 330 L 135 410" 
          fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Destiny Star / Sparks -->
    <polygon points="410,120 416,136 432,142 416,148 410,164 404,148 388,142 404,136" fill="#FCD34D" />
    <polygon points="150,160 154,172 166,176 154,180 150,192 146,180 134,176 146,172" fill="#FCD34D" opacity="0.85" />
  </g>

  <!-- KMU Submark Emblem at Bottom -->
  <g transform="translate(256, 452)">
    <rect x="-90" y="-18" width="180" height="28" rx="14" fill="#000000" fill-opacity="0.25" />
    <text text-anchor="middle" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="13" font-weight="800" fill="#E0E7FF" letter-spacing="2">
      KMU • UNMYEONG
    </text>
  </g>
</svg>
